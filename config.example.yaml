mnemos:
  vault_path: ~/mnemos-vault
  data_dir: ~/.mnemos

embedding:
  # Default: chromadb — uses built-in ONNX model (all-MiniLM-L6-v2), no torch needed
  provider: chromadb
  # Alternative: Ollama (CPU works fine for embeddings)
  # provider: ollama
  # model: nomic-embed-text
  # ollama_url: http://localhost:11434
  # Alternative: sentence-transformers (requires ~2GB torch)
  # provider: sentence-transformers
  # model: intfloat/multilingual-e5-base

search:
  default_limit: 20
  hybrid_alpha: 0.7

api:
  host: 127.0.0.1
  port: 8787
  # --- Authentication (T-AUTH, ADR-0014) ---
  auth_enabled: false             # set true to enforce token auth on all routes
  totp_enabled: false             # set true to require TOTP 2FA after token login
  # totp_master_key is env-only — set via MNEMOS_API__TOTP_MASTER_KEY; required when totp_enabled=true
  session_ttl_sec: 28800          # session lifetime in seconds (range 300–86400; default 8 h)
  session_pin_ip: false           # bind session token to the creation client IP
  behind_tls_proxy: false         # set true when TLS terminates upstream (required for non-loopback bind)
  trusted_proxies: []             # CIDRs whose X-Forwarded-For is trusted, e.g. ["10.0.0.0/8"]
  # --- CORS (T-CORS, ADR-0014) ---
  cors_enabled: false             # set true to enable CORS response headers
  cors_allow_origins: []          # allowed origins, e.g. ["http://localhost:5173"]
  cors_allow_credentials: false   # allow cookies/auth headers cross-origin (cannot combine with origins=["*"])
  cors_allow_methods:             # HTTP methods exposed to cross-origin requests
    - GET
    - POST
    - DELETE
  cors_allow_headers:             # request headers exposed to cross-origin requests
    - Authorization
    - Content-Type

mcp:
  transport: stdio

watcher:
  # Directories to auto-index (used by `mnemos watch` when no args given)
  paths: []
  # paths:
  #   - ~/Projects
  #   - ~/LABs
  ignore_dirs:
    - .git
    - node_modules
    - __pycache__
    - .venv
    - venv
    - dist
    - build
  extensions:
    - .md
    - .py
    - .js
    - .ts
    - .yaml
    - .yml
    - .toml
    - .json
    - .txt
    - .sh
    - .sql
  max_file_size_kb: 512
  auto_scan: true

# ── LLM (synthesis workers + context filter) ────────────────────────────────
# Used by the M4 synthesis pipeline and the M10 context filter. Provider is
# selected via `provider`; API keys are env-only (MNEMOS_LLM__OPENAI_API_KEY,
# MNEMOS_LLM__ANTHROPIC_API_KEY, …) — never commit real keys to this file.
llm:
  provider: ollama               # anthropic | openai | azure_openai | ollama | gemini
  model: qwen2.5:3b
  ollama_url: http://localhost:11434
  temperature: 0.3
  max_tokens: 4096

  # ── RLM (Recursive Language Model) integration ───────────────────────────
  # Optional, opt-in. When enabled, the synthesis pipeline can decompose a
  # large prompt into recursive sub-LLM calls inside a sandboxed Python REPL.
  # See ADR 0008 for the GCW↔RLM pattern mapping. The `rlm_toolkit` package is
  # an optional dependency; if it is not installed, enabling RLM here is
  # rejected at runtime in `create_provider()` (not at config load time).
  rlm:
    enabled: false               # opt-in only — offline by default
    use_infiniretri: false       # dynamic mid-generation retrieval — opt-in only
    threshold_tokens: 10000      # decompose only above this input size
    sandbox: true                # MUST stay true — False is rejected (host code exec risk)
    allowed_imports:             # modules the sandboxed REPL may import
      - re
      - json
      - math
      - datetime
      - collections
      - itertools
    # numpy is intentionally excluded by default; extend this list to add it.
    max_cost: 0.50               # USD ceiling per synthesis call
    max_depth: 3                 # max recursive sub-LLM depth
    max_execution_time: 120      # seconds per synthesis call
